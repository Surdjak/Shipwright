name: android-ap
# Builds the Archipelago-enabled Android APK.
on:
  push:
    branches: [ android-ap ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Apply Android patches to submodules
      run: ./android-ap/apply-patches.sh

    # ---------- host build of soh.o2r (same steps as generate-builds.yml) ----------
    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Install SDL 2.30.3 (host)
      run: |
        mkdir -p deps && cd deps
        wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
        tar -xzf SDL2-2.30.3.tar.gz && cd SDL2-2.30.3
        ./configure --enable-hidapi-libusb > /dev/null
        make -j4 > /dev/null && sudo make install > /dev/null
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/ > /dev/null
    - name: Install tinyxml2 10.0.0 (host)
      run: |
        sudo apt-get remove -y libtinyxml2-dev
        cd deps
        wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
        tar -xzf 10.0.0.tar.gz && cd tinyxml2-10.0.0 && mkdir -p build && cd build
        cmake .. > /dev/null && make -j4 > /dev/null && sudo make install > /dev/null
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-host -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-host --config Release --target GenerateSohOtr -j4
        ls -la soh.o2r

    - name: Stage APK assets
      run: ./android-ap/stage-assets.sh soh.o2r

    # ---------- Android build ----------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install NDK and CMake for Android
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" > /dev/null
    - name: Build APK (release, arm64-v8a, debug-signed)
      working-directory: Android
      run: |
        chmod +x gradlew
        ./gradlew --no-daemon assembleRelease
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: soh-archipelago-android
        path: Android/app/build/outputs/apk/release/*.apk
        retention-days: 30
    - name: Upload native build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: native-build-logs
        path: |
          Android/app/.cxx/**/*.log
          Android/app/.cxx/**/CMakeFiles/CMakeOutput.log
          Android/app/.cxx/**/CMakeFiles/CMakeError.log
        retention-days: 7
