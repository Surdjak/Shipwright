name: android-ap
# Builds the Archipelago-enabled Android APK.
on:
  push:
    branches: [ android-ap ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write   # lets a failed run publish its build log to the android-ap-ci-logs branch
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
    - name: Git Checkout
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Apply Android patches to submodules
      run: ./android-ap/apply-patches.sh

    # ---------- host build of soh.o2r (same steps as generate-builds.yml) ----------
    - name: Install host dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libzip-dev zipcmp zipmerge ziptool
    - name: Install SDL 2.30.3 (host)
      run: |
        mkdir -p deps && cd deps
        wget -q https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
        tar -xzf SDL2-2.30.3.tar.gz && cd SDL2-2.30.3
        ./configure --enable-hidapi-libusb > /dev/null
        make -j4 > /dev/null && sudo make install > /dev/null
        sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/ > /dev/null
    - name: Install tinyxml2 10.0.0 (host)
      run: |
        sudo apt-get remove -y libtinyxml2-dev
        cd deps
        wget -q https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
        tar -xzf 10.0.0.tar.gz && cd tinyxml2-10.0.0 && mkdir -p build && cd build
        cmake .. > /dev/null && make -j4 > /dev/null && sudo make install > /dev/null
    - name: Generate soh.o2r
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-host -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-host --config Release --target GenerateSohOtr -j4
        ls -la soh.o2r

    - name: Stage APK assets
      run: ./android-ap/stage-assets.sh soh.o2r

    # ---------- Android build ----------
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Install NDK and CMake for Android
      run: |
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;26.0.10792818" "cmake;3.31.5" > /dev/null
    - name: Build APK (release, arm64-v8a, debug-signed)
      working-directory: Android
      run: |
        chmod +x gradlew
        set -o pipefail
        ./gradlew --no-daemon assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"
    - name: Collect all native compile errors
      if: failure()
      working-directory: Android
      run: |
        LOGDIR="$RUNNER_TEMP/ci-logs"; mkdir -p "$LOGDIR"
        cp "$RUNNER_TEMP/gradle.log" "$LOGDIR/" 2>/dev/null || true
        # Re-run ninja with -k 0 so one run reports every failing file, not just the first one
        NINJA="$ANDROID_SDK_ROOT/cmake/3.31.5/bin/ninja"
        for d in $(find app/.cxx -name build.ninja -printf '%h\n' 2>/dev/null); do
          "$NINJA" -C "$d" -k 0 > "$LOGDIR/ninja-keep-going.log" 2>&1 || true
          cp "$d/CMakeFiles/CMakeConfigureLog.yaml" "$LOGDIR/" 2>/dev/null || true
        done
        grep -n -E 'error:|error[ :]|FAILED:|undefined (reference|symbol)|CMake Error|What went wrong' \
          "$LOGDIR"/*.log | head -400 > "$LOGDIR/errors-summary.txt" || true
        # Annotations (visible in the run summary)
        grep -m 10 -E 'error:|FAILED:|CMake Error|undefined' "$LOGDIR/errors-summary.txt" | cut -c1-500 | sed 's/^/::error::/' || true
        # Publish logs to a side branch so they can be read without the Actions UI
        cd "$LOGDIR"
        for f in *.log; do [ -f "$f" ] && [ $(stat -c%s "$f") -gt 40000000 ] && tail -c 40000000 "$f" > "$f.tmp" && mv "$f.tmp" "$f"; done
        git init -q -b android-ap-ci-logs .
        git config user.name "android-ap CI"; git config user.email "actions@github.com"
        echo "run ${GITHUB_RUN_ID} for ${GITHUB_SHA}" > RUN.txt
        git add -A && git commit -q -m "CI logs: run ${GITHUB_RUN_ID} (${GITHUB_SHA::7})"
        git push -q -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" android-ap-ci-logs || true
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: soh-archipelago-android
        path: Android/app/build/outputs/apk/release/*.apk
        retention-days: 30
