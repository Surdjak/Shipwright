def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');

// CMake arguments for the native build. Setting SOH_CCACHE=1 in the environment
// (as the CI workflow does) routes compiles through ccache.
def nativeCmakeArgs = ["-DSDL_SHARED=ON", "-DANDROID_STL=c++_static", "-DHAVE_LD_VERSION_SCRIPT=OFF",
                       "-DUSE_OPENGLES=ON", "-DBUILD_REMOTE_CONTROL=1"]
if (System.getenv("SOH_CCACHE") == "1") {
    nativeCmakeArgs += ["-DCMAKE_C_COMPILER_LAUNCHER=ccache", "-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"]
}
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

android {
    ndkVersion "26.0.10792818"
    namespace 'com.dishii.soh'
    compileSdkVersion 31
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        // A fixed key checked into the repo, so every CI build can be installed as an update over the
        // previous one. (signingConfigs.debug uses a fresh random key on each CI runner, which forced an
        // uninstall before every update.) This key is public: it is for test builds, not store releases.
        apCi {
            storeFile file('ap-ci.keystore')
            storePassword 'android'
            keyAlias 'soh-ap'
            keyPassword 'android'
        }
    }
    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.dishii.soh.ap"
        }
        minSdkVersion 24
        targetSdkVersion 33
        // CI builds count up with the workflow run number so each APK is a proper update.
        versionCode 100 + (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionName "9.2.3-ap"
        // Identifies the bundled files (soh.o2r, assets, CA bundle) of this build; the launcher refreshes
        // the copies in SOH-AP whenever it changes.
        buildConfigField "String", "BUNDLED_FILES_ID", "\"${System.getenv("GITHUB_SHA") ?: "local-dev"}\""
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    arguments(*nativeCmakeArgs)
                    abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            debuggable false
            jniDebuggable false
            signingConfig signingConfigs.apCi
            externalNativeBuild {
                cmake {
                    arguments(*nativeCmakeArgs)
                    abiFilters 'arm64-v8a'
                }
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
        variant.outputs.all { output ->
            def projectName = rootProject.name
            def buildType = variant.buildType.name
            def versionName = variant.versionName
            def versionCode = variant.versionCode

            def newApkName = "soh-archipelago_${buildType}_v${versionName}.apk"
            outputFileName = newApkName
        }
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            //ndkBuild {
            //    path 'jni/Android.mk'
            //}
            cmake {
                 path '../../CMakeLists.txt'
                 version "3.31.5"
            }
        }
    }
    lintOptions {
        abortOnError false
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.core:core:1.7.0' // Use the latest version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}

task wrapper(type: Wrapper) {
    gradleVersion = '8.10.2'
}

task prepareKotlinBuildScriptModel {
}
